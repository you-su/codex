/* Motion: short compositor-friendly transitions; no persistent decorative loops. */
button{transition:background-color .16s ease,border-color .16s ease,color .16s ease,transform .12s ease,box-shadow .16s ease}
button:not(:disabled):active{transform:scale(.97)}
button.primary:not(:disabled):hover{background:#28b0ff;box-shadow:0 4px 16px #009fff24}
button:focus-visible{outline:2px solid #47bdff;outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:#47bdff}
nav button{position:relative;transition:background-color .18s ease,color .18s ease}
.port-card,.cards .card{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
@media(hover:hover){.port-card:hover,.cards .card:hover{transform:translateY(-3px);border-color:#3b566b;box-shadow:0 8px 22px #0002}.port-card.current:hover{border-color:var(--blue)}}
tbody tr{transition:background-color .15s ease}tbody tr:hover{background:#16222e}tbody tr:has(input:checked){background:#122b37}
input:not([type=checkbox]),select,textarea{transition:border-color .16s ease,box-shadow .16s ease}
input:focus,select:focus,textarea:focus{border-color:#009fff;box-shadow:none}
input[type=checkbox].switch{transition:background-color .18s ease}
input[type=checkbox].switch:before{left:3px!important;transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s ease}
input[type=checkbox].switch:checked:before{transform:translateX(18px)}
#content.page-enter{animation:page-in .24s ease-out both}
#content.page-enter .port-card,#content.page-enter .cards .card{animation:card-in .28s ease-out both}
#content.page-enter .card:nth-child(2),#content.page-enter .port-card:nth-child(2){animation-delay:30ms}
#content.page-enter .card:nth-child(3),#content.page-enter .port-card:nth-child(3){animation-delay:60ms}
#content.page-enter .card:nth-child(4),#content.page-enter .port-card:nth-child(n+4){animation-delay:90ms}
dialog[open]{animation:dialog-fade .16s ease-out both;transform:none}

#notice{position:fixed;z-index:100;right:26px;bottom:20px;max-width:min(520px,calc(100vw - 32px));margin:0;padding:12px 18px;border:1px solid #4f452c;border-radius:9px;background:#20201c;box-shadow:0 8px 30px #0004;animation:card-in .18s ease-out}

.logo{overflow:hidden;flex-shrink:0;background:#f9f8f6}.logo img{display:block;width:100%;height:100%;object-fit:contain}.about .logo{width:96px;height:96px}

/* About: isolated decorative layers, no pointer capture or remote assets. */
.about{position:relative;isolation:isolate;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 50% 45%,#102a4855,transparent 68%)}

.about::after{content:"";position:absolute;z-index:-1;width:560px;height:560px;max-width:95%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#009fff22 0%,#6552ff16 38%,transparent 68%);animation:ai-glow 12s ease-in-out infinite alternate}

.ai-orbit::after{top:auto;bottom:-3px;background:#8c83ff}

.ai-node:nth-of-type(4){left:14%;top:26%}.ai-node:nth-of-type(5){left:83%;top:28%;animation-delay:-2s}.ai-node:nth-of-type(6){left:21%;top:74%;animation-delay:-3s}.ai-node:nth-of-type(7){left:77%;top:69%;animation-delay:-1s}
.about .panel{position:relative;background:linear-gradient(145deg,#142135f5,#101620f5);border-color:#2b506c;box-shadow:0 20px 70px #0005,0 0 35px #009fff0a}

.about .construction{background:#0c1522c9;border-color:#29415b}.about .logo{box-shadow:0 0 24px #009fff28}
@keyframes ai-glow{from{transform:translate(-35px,-20px) scale(.95);opacity:.6}to{transform:translate(35px,20px) scale(1.1);opacity:1}}
@keyframes ai-scan{from{transform:translateY(-55%)}to{transform:translateY(55%)}}

/* High-energy AI scene, confined to About. */
.about{background:radial-gradient(ellipse at 50% 45%,#072b57 0%,#080d27 46%,#030712 100%);min-height:calc(100vh - 125px)}

.ai-scene{z-index:-1}.ai-orbit{width:760px;height:760px;border:2px solid #00cfff66;box-shadow:0 0 24px #00baff22,inset 0 0 24px #00baff12;animation:orbit-spin 18s linear infinite}

.about .panel{z-index:2;border:1px solid #38dfffaa;background:linear-gradient(135deg,#08172aee,#10112bee);box-shadow:0 0 0 5px #00cfff08,0 0 40px #00cfff30,0 30px 90px #000b;backdrop-filter:blur(10px)}
.about .panel::before{left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#12dbff,#a689ff,transparent);box-shadow:0 0 20px #00cfff;animation:edge-pulse 2.8s ease-in-out infinite alternate}
.about .panel::after{content:"AI VISUAL / LOCAL";position:absolute;left:20px;top:13px;color:#4ee4ff;font:9px Consolas,monospace;letter-spacing:2px;opacity:.7}
.about .logo{box-shadow:0 0 25px #00cfff55,0 0 65px #7061ff44;border:2px solid #4ee4ff}
.about h2{text-shadow:0 0 22px #24caff88}.about .construction{border-color:#368aa466;box-shadow:inset 0 0 28px #008cff12}
.ai-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
@keyframes orbit-spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes reactor-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

@media(max-width:750px){.ai-orbit{width:580px;height:580px}.ai-orbit.inner{width:470px;height:470px}}

</style><aside><div class="brand"><div class="logo"><img src="logo.svg" alt="大肥鱼角色图标" width="64" height="64"></div><div><strong>大肥鱼 API</strong><small>MODEL TERMINAL PRO 1.0</small></div></div><small>工作台</small><nav id="nav"></nav><div class="sidebar-status"><small>运行状态</small><div class="mini"><strong>● QQ 大肥鱼 · 未接入</strong><p>本地终端 <span>127.0.0.1:8765</span></p><p>连接方式 <span>本地运行</span></p></div><strong>本地项目 · 管理员</strong><p class="muted">密钥仅保存在本次运行内存</p></div></aside><main><header><div><small id="crumb">工作台 / 终端首页</small><h1 id="title"></h1></div><div class="header-tools"><span class="badge neutral">● 本地服务</span><input id="search" placeholder="搜索端口 / 模型" aria-label="搜索端口或模型" oninput="query=this.value;render()"><button onclick="checkAll()" title="刷新端口状态">⟳</button></div></header><div id="notice" role="status"></div><section id="content"></section></main>
<dialog id="editor"><form id="form"><h2>模型端口配置</h2><input name="id" type="hidden"><label>端口名称<input name="name" required placeholder="例如：DeepSeek 主端口"></label><label>协议<select name="protocol"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI 兼容</option></select></label><label>API 基础地址<input name="url" required type="url" placeholder="https://api.deepseek.com"></label><label>API 密钥<input name="key" type="password" autocomplete="new-password" placeholder="仅存内存；留空保留当前密钥"></label><label>模型名称<input name="model" placeholder="填写服务商提供的模型 ID"></label><p class="muted">OpenAI 兼容地址请包含服务商要求的 /v1。密钥重启后需重新填写；更换地址会清除原密钥。</p><div class="toolbar"><button class="primary">保存端口</button><button type="button" onclick="editor.close()">取消</button></div></form></dialog>
<script>
let query='',state={ports:[],config:{}},page='终端首页',selected=new Set(),selection=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pendingRequests=0;
async function api(path,body){
 pendingRequests++;document.body.classList.add('is-busy');$('#content').setAttribute('aria-busy','true');$('#notice').classList.add('loading');$('#notice').textContent=path==='send'||path==='chat'?'模型正在回复，请稍候…':path==='check'?'正在检测端口…':'正在保存与同步…';
 try{const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Local-Token':'__TOKEN__'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);$('#notice').textContent='';return data}
 catch(e){$('#notice').textContent=e.message;throw e}
 finally{pendingRequests--;if(!pendingRequests){document.body.classList.remove('is-busy');$('#content').setAttribute('aria-busy','false');$('#notice').classList.remove('loading')}}
}

function balances(p){return p.balance?.length?p.balance.map(b=>esc(b.currency)+' '+esc(b.total_balance)).join(' / '):p.balanceError?esc(p.balanceError):p.protocol==='deepseek'?'尚未查询':'暂不支持查询'}
const names=['终端首页','模型端口','模型配置','关于我们','运行日志'];
const pid=p=>'P'+(state.ports.indexOf(p)+1);
const good=p=>p.hasKey&&p.status==='接口可达';
const badge=p=>`<span class="badge ${good(p)?'':/失败|不可用/.test(p.status)?'bad':'neutral'}">● ${esc(p.hasKey?p.status:'待填密钥')}</span>`;
const ordered=()=>[...state.ports].sort((a,b)=>(a.priority||100)-(b.priority||100));
const active=()=>state.ports.find(p=>p.id===state.activePort);
let lastRenderedPage=null;
function render(){
 const pageChanged=lastRenderedPage!==page;lastRenderedPage=page;
 const content=$('#content');content.classList.remove('page-enter');
 if(pageChanged){void content.offsetWidth;content.classList.add('page-enter')}
 $('#title').textContent=page;$('#crumb').textContent='工作台 / '+page;

async function uploadVoice(target,input){
 const file=pendingVoices[target];if(!file)return;if(voiceBusy){input.value='';voiceStatus('已有音频正在处理，请完成后再上传。');return}

  const text=(offset,str)=>{for(let i=0;i<str.length;i++)view.setUint8(offset+i,str.charCodeAt(i))};
  text(0,'RIFF');view.setUint32(4,36+samples.length*2,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,16000,true);view.setUint32(28,32000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,samples.length*2,true);
  for(let start=0;start<samples.length;start+=320000){for(let i=start;i<Math.min(start+320000,samples.length);i++){const v=Math.max(-1,Math.min(1,samples[i]));view.setInt16(44+i*2,v<0?v*32768:v*32767,true)}await new Promise(r=>setTimeout(r,0))}
  voiceStatus('正在保存到本地，请稍候…');
  const response=await fetch('/api/voice/'+target,{method:'POST',headers:{'X-Local-Token':'__TOKEN__','Content-Type':'audio/wav','X-Audio-Name':encodeURIComponent(file.name)},body:buffer});
  const data=await response.json();if(!response.ok)throw Error(data.error);state=data;delete pendingVoices[target];voiceBusy=false;render();voiceStatus('参考音频已保存。可以试听；定制语音生成等待音色克隆服务接入。');
 }catch(e){voiceStatus(e.name==='EncodingError'?'浏览器无法解码此音频，请转换为 MP3 或 WAV 后重试。':e.message||'音频处理失败。')}
 finally{voiceBusy=false;input.disabled=false;input.textContent='保存音频';if(ctx)await ctx.close()}
}

 function resize(){const box=canvas.getBoundingClientRect();width=box.width;height=box.height;const dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:width<700?38:70},()=>({x:Math.random()*width,y:Math.random()*height,vx:(Math.random()-.5)*.65,vy:(Math.random()-.5)*.65}));rain=Array.from({length:Math.ceil(width/48)},(_,i)=>({x:i*48,y:Math.random()*height,speed:1+Math.random()*1.5}));if(reduced.matches)draw(false)}
 function draw(move){ctx.clearRect(0,0,width,height);ctx.font='11px Consolas,monospace';for(const column of rain){if(move)column.y=(column.y+column.speed)%(height+100);for(let j=0;j<7;j++){ctx.fillStyle=`rgba(0,215,255,${(1-j/7)*.28})`;ctx.fillText(((Math.floor(column.x)+j)%3===0?'1':'0'),column.x,column.y-j*16)}}
 for(let i=0;i<particles.length;i++){const p=particles[i];if(move){p.x=(p.x+p.vx+width)%width;p.y=(p.y+p.vy+height)%height}for(let j=i+1;j<particles.length;j++){const q=particles[j],distance=Math.hypot(p.x-q.x,p.y-q.y);if(distance<130){ctx.strokeStyle=`rgba(38,184,255,${(1-distance/130)*.35})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}ctx.fillStyle=i%3?'#43d9ff':'#b18aff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=9;ctx.beginPath();ctx.arc(p.x,p.y,i%5===0?2.2:1.3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}
 function tick(now){if(disposed||document.hidden||reduced.matches)return;if(now-last>32){draw(true);last=now}frame=requestAnimationFrame(tick)}
 function resume(){cancelAnimationFrame(frame);if(reduced.matches)draw(false);else if(!document.hidden)frame=requestAnimationFrame(tick)}
 const observer=new ResizeObserver(resize);observer.observe(canvas);resize();resume();document.addEventListener('visibilitychange',resume);reduced.addEventListener('change',resume);
 stopAboutFX=()=>{disposed=true;cancelAnimationFrame(frame);observer.disconnect();document.removeEventListener('visibilitychange',resume);reduced.removeEventListener('change',resume)};
}

api('state').then(s=>{state=s;render()}).catch(()=>{});

<style>nav{max-height:55vh;overflow:auto}@media(max-width:750px){nav{flex-wrap:wrap}nav button{width:auto;flex:1 0 25%}}pre{user-select:text}</style><script>names.push('多轮对话','数据与工具');
let sessionId='',chatBusy=false;
const originalRenderPro=render;
render=function(){originalRenderPro();
 if(page==='多轮对话')renderConversations();
 if(page==='数据与工具')renderTools();
};
function renderConversations(){
 const sessions=state.sessions||[];let s=sessions.find(s=>s.id===sessionId)||sessions[0];sessionId=s?.id||'';
 $('#content').innerHTML=`<div class="toolbar"><button class="primary" onclick="newSession()">＋ 新建会话</button><select aria-label="会话" style="width:260px" onchange="sessionId=this.value;render()">${sessions.map(x=>`<option value="${x.id}" ${x.id===sessionId?'selected':''}>${esc(x.title)}</option>`).join('')}</select>${s?'<button onclick="exportChat()">导出 Markdown</button><button class="danger" onclick="deleteSession()">删除会话</button>':''}</div><div class="panel"><h2>多轮对话</h2><p class="muted">使用当前端口和自动故障切换；每次携带最近 20 轮上下文。请求可能计费，故障切换会把上下文发送到备用服务商。会话明文保存在本机 settings.json。</p>${s?.system?`<p>系统提示词：${esc(s.system)}</p>`:''}<div id="messages">${s?(s.messages.map(m=>`<article class="card"><strong>${m.role==='user'?'你':esc(m.port||'助手')}</strong><div style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px">${esc(m.content)}</div>${m.tokens!==undefined?`<p class="muted">${m.tokens} tokens</p>`:''}</article>`).join('')||'<div class="empty">开始你的第一轮对话</div>'):'<div class="empty">先新建一个会话</div>'}</div>${s?`<form onsubmit="event.preventDefault();sendConversation()"><textarea id="compose" rows="4" maxlength="12000" placeholder="输入消息，点击发送" ${chatBusy?'disabled':''}></textarea><p><button class="primary" ${chatBusy?'disabled':''}>${chatBusy?'正在等待模型…':'发送消息'}</button></p></form>`:''}</div>`;
}
async function newSession(){const system=prompt('系统提示词（可留空，例如：你是一名耐心的编程助手）','');if(system===null)return;try{state=await api('session',{system});sessionId=state.sessions.at(-1).id;render()}catch{}}
async function deleteSession(){if(chatBusy||!confirm('永久删除这个会话及其本地消息？'))return;try{state=await api('session',{id:sessionId,delete:true});sessionId='';render()}catch{}}
async function sendConversation(){if(chatBusy)return;const text=$('#compose').value;if(!text.trim())return;const id=sessionId;chatBusy=true;render();try{state=await api('converse',{id,message:text});render()}catch{if(page==='多轮对话'){$('#compose').value=text}}finally{chatBusy=false;if(page==='多轮对话'){const draft=$('#compose')?.value||'';render();$('#compose').value=draft;}}}
function downloadPro(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportChat(){const s=state.sessions.find(s=>s.id===sessionId);downloadPro('会话.md','# '+s.title+'\n\n'+s.messages.map(m=>'## '+(m.role==='user'?'你':'助手')+'\n\n'+m.content).join('\n\n'),'text/markdown')}
function renderTools(){
 $('#content').innerHTML=`<div class="cards"><div class="card">端口总数<div class="value">${state.ports.length}</div></div><div class="card">本工具累计 tokens<div class="value">${state.ports.reduce((a,p)=>a+(p.tokens||0),0)}</div></div><div class="card">增强会话成功请求<div class="value">${state.ports.reduce((a,p)=>a+(p.requests||0),0)}</div></div><div class="card">已保存会话<div class="value">${(state.sessions||[]).length}</div></div></div><div class="panel"><h2>配置迁移</h2><p>导出端口名称、地址、协议、模型和优先级，不包含密钥、聊天记录或音频。导入采用追加模式，可用原版 settings.json 或本版导出文件。</p><button onclick="exportConfig()">导出配置 JSON</button><label>导入配置<input type="file" accept=".json,application/json" onchange="importConfig(this)"></label></div><div class="panel"><h2>模型与诊断</h2><p class="muted">读取模型列表和批量检测均发起真实网络请求；模型列表可达不代表生成服务可用。</p><button onclick="checkAll()">批量检测所有端口</button><div class="table-wrap"><table><thead><tr><th>端口</th><th>模型</th><th>增强会话成功 / 失败</th><th>最近耗时</th><th>操作</th></tr></thead><tbody>${state.ports.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.model)}</td><td>${p.requests||0} / ${p.failures||0}</td><td>${p.latencyMs===undefined?'—':p.latencyMs+' ms'}</td><td><button onclick="discoverModels('${p.id}')">读取模型列表</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
async function exportConfig(){try{downloadPro('大肥鱼-端口配置.json',JSON.stringify(await api('export',{}),null,2))}catch{}}
async function importConfig(input){try{const file=input.files[0];if(!file)return;if(file.size>60000)throw Error('配置文件须小于 60KB');const data=JSON.parse(await file.text());if(!confirm('将追加导入端口，导入后请重新填写密钥。继续？'))return;state=await api('import',data);render()}catch(e){$('#notice').textContent=e.message}}
async function discoverModels(id){try{const r=await api('models',{id});modal('<h2>服务商模型列表</h2><p class="muted">复制所需模型 ID，到端口编辑框中填写。</p><pre style="white-space:pre-wrap;max-height:50vh;overflow:auto">'+esc(r.models.join('\n')||'没有返回模型')+'</pre>')}catch{}}
